[package]
name = "dta2json"
version = "0.4.2"
edition = "2024"
authors = ["Markku Sukanen <markku.sukanen@gmail.com>"]
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
once_cell = "1.21"
gurpschgen-lib = { path = "../gurpschgen-lib", features = ["dta2json"]}
regex = "1.13.1"
fancy-regex = "0.19"
serde_json = "1.0"
glob = "0.3.4"
either = "1.17.0"
env_logger = "0.11.11"
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }

[features]
default = []
deep-tests = ["default"]
